name: Project control

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-project-control:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate project control
        run: python scripts/validate_project_control.py --repository "${{ github.repository }}"
